<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Kerusakan Lab Komputer</title>
</head>
<body><link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"> 
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">

<form>
     <h1 align="center" style="margin: 3%;">Laporan Kerusakan Lab Komputer</h1>
  <div class="form-group row" style="padding-left: 5%;">
    <label for="text" class="col-2 col-form-label">Nama</label> 
    <div class="col-8">
      <div class="input-group">
        <div class="input-group-prepend">
          <div class="input-group-text">
            <i class="fa fa-address-book"></i>
          </div>
        </div> 
        <input id="text" name="text" type="text" class="form-control">
      </div>
    </div>
  </div>
  <div class="form-group row" style="padding-left: 5%;">
    <label for="text1" class="col-2 col-form-label">No Telepon</label> 
    <div class="col-8">
      <div class="input-group">
        <div class="input-group-prepend">
          <div class="input-group-text">
            <i class="fa fa-address-book-o"></i>
          </div>
        </div> 
        <input id="text1" name="text1" type="text" class="form-control">
      </div>
    </div>
  </div>
  <div class="form-group row" style="padding-left: 5%;">
    <label class="col-2">Barang yang rusak</label> 
    <div class="col-8">
      <div class="custom-control custom-checkbox custom-control-inline">
        <input name="checkbox" id="checkbox_0" type="checkbox" class="custom-control-input" value="Mouse"> 
        <label for="checkbox_0" class="custom-control-label">Mouse</label>
      </div>
      <div class="custom-control custom-checkbox custom-control-inline">
        <input name="checkbox" id="checkbox_1" type="checkbox" class="custom-control-input" value="Monitor"> 
        <label for="checkbox_1" class="custom-control-label">Monitor</label>
      </div>
      <div class="custom-control custom-checkbox custom-control-inline">
        <input name="checkbox" id="checkbox_2" type="checkbox" class="custom-control-input" value="PC"> 
        <label for="checkbox_2" class="custom-control-label">PC</label>
      </div>
      <div class="custom-control custom-checkbox custom-control-inline">
        <input name="checkbox" id="checkbox_3" type="checkbox" class="custom-control-input" value="Keyboard"> 
        <label for="checkbox_3" class="custom-control-label">Keyboard</label>
      </div>
    </div>
  </div>
  <div class="form-group row" style="padding-left: 5%;">
    <label class="col-2">Solusi</label> 
    <div class="col-8">
      <div class="custom-control custom-radio custom-control-inline">
        <input name="radio" id="radio_0" type="radio" class="custom-control-input" value="Perbaiki sendiri"> 
        <label for="radio_0" class="custom-control-label">Perbaiki sendiri</label>
      </div>
      <div class="custom-control custom-radio custom-control-inline">
        <input name="radio" id="radio_1" type="radio" class="custom-control-input" value="Antar ke toko service"> 
        <label for="radio_1" class="custom-control-label">Antar ke toko service</label>
      </div>
    </div>
  </div>
  <div class="form-group row" style="padding-left: 5%;">
    <label for="select" class="col-2 col-form-label">Penyebab</label> 
    <div class="col-8">
      <select id="select" name="select" class="custom-select">
        <option value="Kalalaian Diri">Kalalaian Diri</option>
        <option value="Tiba-tiba eror">Tiba-tiba eror</option>
      </select>
    </div>
  </div>
  <div class="form-group row" style="padding-left: 5%;">
    <label for="textarea" class="col-2 col-form-label">Alur kerusakan</label> 
    <div class="col-8">
      <textarea id="textarea" name="textarea" cols="40" rows="5" class="form-control"></textarea>
    </div>
  </div> 
  <div class="form-group row">
    <div class="offset-4 col-8">
      <button name="submit" type="submit" class="btn btn-primary">Submit</button>
    </div>
  </div>
</form>
    
</body>
</html>
